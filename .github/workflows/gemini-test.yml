# TEMP (remove after review): one-off Gemini summary test
name: gemini-test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gemini-test.yml', '.github/gemini-test.mjs']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/gemini-test.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/probe
          git commit -m "Gemini test result" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
