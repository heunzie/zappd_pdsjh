# 베타 → 메인 반영
# 테스트 페이지(beta.html)를 두 사람이 모두 확인한 뒤에만 실제 보드(index.html)로 옮긴다.
# 한 명이 Actions > "베타 → 메인 반영" > Run workflow 를 누르면, 다른 한 명이 승인(Review deployments → Approve)해야 실행된다.
# 승인 규칙은 저장소 Settings > Environments > main-board 에서 설정 (Required reviewers: heunzie, Daarmoon / Prevent self-review 체크).
name: 베타 → 메인 반영
on:
  workflow_dispatch:
    inputs:
      memo:
        description: '무엇을 반영하나요? (예: 폰 확대·축소, 날짜 왼쪽 배치)'
        type: string
        required: true
      both_checked:
        description: '두 사람 모두 테스트 페이지(PC·폰)에서 확인했어요'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 여기서 멈추고 상대방 승인을 기다림 (누른 사람은 스스로 승인 못 함)
    environment: main-board
    steps:
      - name: 확인 체크
        if: ${{ !inputs.both_checked }}
        run: |
          echo "::error::'두 사람 모두 확인했어요'에 체크해야 반영돼요. 실제 보드는 그대로예요."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: beta.html → index.html
        run: node .github/promote.mjs
      - name: 실제 보드에 올리기
        env:
          MEMO: ${{ inputs.memo }}
          BY: ${{ github.triggering_actor }}
        run: |
          if git diff --quiet index.html; then
            echo "::notice::테스트 페이지와 실제 보드가 이미 같아요. 반영할 게 없어요."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -q -m "베타 → 메인 반영: ${MEMO}" -m "실행: ${BY} · 승인: Actions 실행 기록 참고"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          echo "::notice::실제 보드에 반영했어요. 1~2분 뒤 https://heunzie.github.io/zappd_pdsjh/ 에서 보여요."
