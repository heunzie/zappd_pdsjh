# 베타 → 메인 반영
# 테스트 페이지(beta.html)를 실제 보드(index.html)로 옮긴다.
# - heunzie(메인 운영자)가 실행하면 바로 반영 (환경 main-direct, 승인 없음)
# - 그 밖의 사람(성준 = Daarmoon)이 실행하면 heunzie가 승인해야 반영 (환경 main-board)
# 승인 규칙: 저장소 Settings > Environments > main-board > Required reviewers: heunzie
name: 베타 → 메인 반영
on:
  workflow_dispatch:
    inputs:
      memo:
        description: '무엇을 반영하나요? (예: 폰 확대·축소, 날짜 왼쪽 배치)'
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: promote
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # heunzie가 아니면 여기서 멈추고 heunzie 승인을 기다림
    environment: ${{ github.triggering_actor == 'heunzie' && 'main-direct' || 'main-board' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: beta.html → index.html
        run: node .github/promote.mjs
      - name: 실제 보드에 올리기
        env:
          MEMO: ${{ inputs.memo }}
          BY: ${{ github.triggering_actor }}
        run: |
          if git diff --quiet index.html; then
            echo "::notice::테스트 페이지와 실제 보드가 이미 같아요. 반영할 게 없어요."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -q -m "베타 → 메인 반영: ${MEMO}" -m "실행: ${BY}$([ "$BY" = heunzie ] || echo ' · 승인: heunzie')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          echo "::notice::실제 보드에 반영했어요. 1~2분 뒤 https://heunzie.github.io/zappd_pdsjh/ 에서 보여요."
